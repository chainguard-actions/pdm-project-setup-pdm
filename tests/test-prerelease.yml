name: Test PDM setup with prerelease allowed
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          python-version: "3.11"
          prerelease: "true"
          update-python: "true"
      - name: Assert pdm-version output is set
        env:
          PDM_VERSION: ${{ steps.action.outputs.pdm-version }}
        run: |
          echo "pdm-version: $PDM_VERSION"
          if [ -z "$PDM_VERSION" ]; then
            echo "FAIL: pdm-version output is empty"
            exit 1
          fi
          echo "PASS: pdm-version=$PDM_VERSION"
      - name: Assert pdm-bin output is set
        env:
          PDM_BIN: ${{ steps.action.outputs.pdm-bin }}
        run: |
          echo "pdm-bin: $PDM_BIN"
          if [ -z "$PDM_BIN" ]; then
            echo "FAIL: pdm-bin output is empty"
            exit 1
          fi
          echo "PASS: pdm-bin=$PDM_BIN"
      - name: Assert PDM is runnable
        run: |
          pdm --version
          echo "PASS: pdm is on PATH and runnable"
