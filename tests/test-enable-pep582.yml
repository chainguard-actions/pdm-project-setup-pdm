name: Test enable-pep582
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          python-version: '3.12'
          enable-pep582: 'true'
      - name: Assert PYTHONPATH set to pep582
        run: |
          echo "PYTHONPATH: $PYTHONPATH"
          case "$PYTHONPATH" in
            *pdm/pep582*) ;;
            *) echo "FAIL: PYTHONPATH does not point to pdm pep582"; exit 1 ;;
          esac
          echo "PASS"
