name: Test basic PDM setup
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-pdm
        uses: .
        with:
          update-python: 'false'
      - name: Assert pdm-version output is set
        env:
          ACTUAL: ${{ steps.setup-pdm.outputs.pdm-version }}
        run: |
          echo "actual pdm-version: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: pdm-version output is empty"
            exit 1
          fi
          echo "PASS: pdm-version=$ACTUAL"
      - name: Assert pdm-bin output is set
        env:
          ACTUAL: ${{ steps.setup-pdm.outputs.pdm-bin }}
        run: |
          echo "actual pdm-bin: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: pdm-bin output is empty"
            exit 1
          fi
          echo "PASS: pdm-bin=$ACTUAL"
      - name: Assert PDM is executable
        run: |
          pdm --version
          echo "PASS: pdm is available in PATH"
