name: Test specific PDM version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          python-version: '3.11'
          version: '2.20.1'
      - name: Assert pdm version
        env:
          PDM_VERSION: ${{ steps.action.outputs.pdm-version }}
          PY_VERSION: ${{ steps.action.outputs.python-version }}
        run: |
          echo "pdm-version: $PDM_VERSION"
          echo "python-version: $PY_VERSION"
          if ! echo "$PDM_VERSION" | grep -q "2.20.1"; then
            echo "FAIL: expected pdm-version to contain 2.20.1"
            exit 1
          fi
          case "$PY_VERSION" in
            3.11*) ;;
            *) echo "FAIL: python-version should start with 3.11"; exit 1 ;;
          esac
          which pdm || { echo "FAIL: pdm not on PATH"; exit 1; }
          pdm --version | tee /tmp/v.txt
          grep -q "2.20.1" /tmp/v.txt || { echo "FAIL: pdm binary version mismatch"; exit 1; }
          echo "PASS"
