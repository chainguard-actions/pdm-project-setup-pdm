name: Test architecture input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          python-version: '3.12'
          architecture: ${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}
      - name: Assert outputs
        env:
          PY_VERSION: ${{ steps.action.outputs.python-version }}
          PY_PATH: ${{ steps.action.outputs.python-path }}
          PDM_VERSION: ${{ steps.action.outputs.pdm-version }}
          PDM_BIN: ${{ steps.action.outputs.pdm-bin }}
        run: |
          echo "python-version: $PY_VERSION"
          echo "python-path: $PY_PATH"
          echo "pdm-version: $PDM_VERSION"
          echo "pdm-bin: $PDM_BIN"
          case "$PY_VERSION" in
            3.12*) ;;
            *) echo "FAIL: python-version should start with 3.12"; exit 1 ;;
          esac
          if [ -z "$PDM_VERSION" ]; then echo "FAIL: pdm-version empty"; exit 1; fi
          case "$PDM_BIN" in
            */pdm) ;;
            *) echo "FAIL: pdm-bin should end with /pdm"; exit 1 ;;
          esac
          if [ -z "$PY_PATH" ] || [ ! -x "$PY_PATH" ]; then echo "FAIL: python-path not executable"; exit 1; fi
          "$PY_PATH" -c 'import platform; print(platform.machine())'
          echo "PASS"
