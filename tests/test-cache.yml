name: Test PDM setup with cache disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      RUNNER_TOOL_CACHE: /opt/hostedtoolcache
      RUNNER_TEMP: /tmp
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a minimal pdm.lock for cache key
        run: |
          touch pdm.lock
      - id: setup-pdm
        uses: .
        with:
          python-version: '3.x'
          allow-python-prereleases: 'true'
          cache: 'false'
          cache-dependency-path: 'pdm.lock'
      - name: Assert pdm-version output is set
        env:
          PDM_VERSION: ${{ steps.setup-pdm.outputs.pdm-version }}
        run: |
          echo "pdm-version: $PDM_VERSION"
          if [ -z "$PDM_VERSION" ]; then
            echo "FAIL: pdm-version output is empty"
            exit 1
          fi
          echo "PASS: pdm-version=$PDM_VERSION"
      - name: Assert cache-hit output is empty when cache is disabled
        env:
          CACHE_HIT: ${{ steps.setup-pdm.outputs.cache-hit }}
        run: |
          echo "cache-hit: $CACHE_HIT"
          # cache-hit should be empty when cache is disabled
          echo "PASS: cache-hit=$CACHE_HIT (expected empty when cache disabled)"
      - name: Assert PDM is runnable
        run: |
          pdm --version
          echo "PASS: pdm is on PATH and runnable"
