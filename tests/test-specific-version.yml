name: Test specific PDM version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      RUNNER_TOOL_CACHE: /opt/hostedtoolcache
      RUNNER_TEMP: /tmp
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-pdm
        uses: .
        with:
          python-version: '3.x'
          allow-python-prereleases: 'true'
          version: '2.15.4'
      - name: Assert pdm-version matches requested version
        env:
          PDM_VERSION: ${{ steps.setup-pdm.outputs.pdm-version }}
        run: |
          echo "pdm-version: $PDM_VERSION"
          if [ -z "$PDM_VERSION" ]; then
            echo "FAIL: pdm-version output is empty"
            exit 1
          fi
          if [ "$PDM_VERSION" != "2.15.4" ]; then
            echo "FAIL: expected pdm-version=2.15.4, got $PDM_VERSION"
            exit 1
          fi
          echo "PASS: pdm-version=$PDM_VERSION"
      - name: Assert PDM reports correct version
        run: |
          INSTALLED=$(pdm --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          echo "installed version: $INSTALLED"
          if [ "$INSTALLED" != "2.15.4" ]; then
            echo "FAIL: expected 2.15.4, got $INSTALLED"
            exit 1
          fi
          echo "PASS: pdm version matches"
