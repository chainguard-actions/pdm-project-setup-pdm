name: Test PDM setup with specific version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-pdm
        uses: .
        with:
          update-python: 'false'
          version: "2.18.1"
      - name: Assert pdm-version output matches requested version
        env:
          ACTUAL: ${{ steps.setup-pdm.outputs.pdm-version }}
        run: |
          echo "actual pdm-version: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: pdm-version output is empty"
            exit 1
          fi
          if [ "$ACTUAL" != "2.18.1" ]; then
            echo "FAIL: expected pdm-version '2.18.1', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: pdm-version=$ACTUAL"
      - name: Assert PDM reports correct version
        run: |
          INSTALLED=$(pdm --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          echo "installed pdm version: $INSTALLED"
          if [ "$INSTALLED" != "2.18.1" ]; then
            echo "FAIL: expected PDM 2.18.1, got $INSTALLED"
            exit 1
          fi
          echo "PASS: pdm version matches"
