name: Test python-version-file input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      RUNNER_TOOL_CACHE: /opt/hostedtoolcache
      RUNNER_TEMP: /tmp
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create .python-version file
        run: |
          echo "3.x" > .python-version
      - id: setup-pdm
        uses: .
        with:
          python-version-file: '.python-version'
          allow-python-prereleases: 'true'
      - name: Assert pdm-version output is set
        env:
          PDM_VERSION: ${{ steps.setup-pdm.outputs.pdm-version }}
        run: |
          echo "pdm-version: $PDM_VERSION"
          if [ -z "$PDM_VERSION" ]; then
            echo "FAIL: pdm-version output is empty"
            exit 1
          fi
          echo "PASS: pdm-version=$PDM_VERSION"
      - name: Assert python-version output is set
        env:
          PYTHON_VERSION: ${{ steps.setup-pdm.outputs.python-version }}
        run: |
          echo "python-version: $PYTHON_VERSION"
          if [ -z "$PYTHON_VERSION" ]; then
            echo "FAIL: python-version output is empty"
            exit 1
          fi
          echo "PASS: python-version=$PYTHON_VERSION"
      - name: Assert PDM is runnable
        run: |
          pdm --version
          echo "PASS: pdm is on PATH and runnable"
