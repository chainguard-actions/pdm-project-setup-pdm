name: Test python-version-file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          python-version-file: tests/fixtures/python-version
      - name: Assert python version from file
        env:
          PY_VERSION: ${{ steps.action.outputs.python-version }}
          PDM_VERSION: ${{ steps.action.outputs.pdm-version }}
        run: |
          echo "python-version: $PY_VERSION"
          echo "pdm-version: $PDM_VERSION"
          case "$PY_VERSION" in
            3.11*) ;;
            *) echo "FAIL: expected python 3.11.x"; exit 1 ;;
          esac
          if [ -z "$PDM_VERSION" ]; then echo "FAIL: pdm-version empty"; exit 1; fi
          echo "PASS"
